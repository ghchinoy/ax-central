name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-macos:
    needs: [release-please]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install Playwright Chromium & run quality gates
        run: |
          cd frontend && npm ci && npx playwright install chromium
          cd ..
          make lint
          make test
      - name: Build and package macOS Universal app
        run: |
          VERSION="$(jq -r .info.productVersion wails.json)"
          wails build -nosyncgomod -platform darwin/universal -ldflags "-s -w -X main.appVersion=${VERSION}"
          mkdir -p dist
          ditto -c -k --keepParent "build/bin/AX Central.app" "dist/AX-Central-v${VERSION}-darwin-universal.zip"
          cd dist && shasum -a 256 "AX-Central-v${VERSION}-darwin-universal.zip" > SHA256SUMS-darwin.txt
      - name: Upload macOS Release Assets
        if: startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          files: |
            dist/AX-Central-*-darwin-universal.zip
            dist/SHA256SUMS-darwin.txt

  build-linux:
    needs: [release-please]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install GTK3 & WebKit2GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build and package Linux amd64 binary
        run: |
          cd frontend && npm ci && cd ..
          VERSION="$(jq -r .info.productVersion wails.json)"
          wails build -nosyncgomod -platform linux/amd64 -tags webkit2_41 -ldflags "-s -w -X main.appVersion=${VERSION}"
          mkdir -p dist
          tar -C build/bin -czf "dist/AX-Central-v${VERSION}-linux-amd64.tar.gz" ax-central
          cd dist && sha256sum "AX-Central-v${VERSION}-linux-amd64.tar.gz" > SHA256SUMS-linux.txt
      - name: Upload Linux Release Assets
        if: startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          files: |
            dist/AX-Central-*-linux-amd64.tar.gz
            dist/SHA256SUMS-linux.txt

  build-windows:
    needs: [release-please]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build and package Windows amd64 binary
        shell: bash
        run: |
          cd frontend && npm ci && cd ..
          VERSION="$(jq -r .info.productVersion wails.json)"
          wails build -nosyncgomod -platform windows/amd64 -ldflags "-s -w -X main.appVersion=${VERSION}"
          mkdir -p dist
          powershell -Command "Compress-Archive -Path 'build/bin/ax-central.exe' -DestinationPath 'dist/AX-Central-v${VERSION}-windows-amd64.zip'"
          cd dist && sha256sum "AX-Central-v${VERSION}-windows-amd64.zip" > SHA256SUMS-windows.txt
      - name: Upload Windows Release Assets
        if: startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          files: |
            dist/AX-Central-*-windows-amd64.zip
            dist/SHA256SUMS-windows.txt
